<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMRAN SERVER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #11180e 0%, #2a3b24 100%);
            min-height: 100vh;
            margin: 0;
            color: #333;
        }
        .glass-panel {
            background: rgba(243, 244, 246, 0.98);
            border-radius: 6px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        .form-card {
            background: #ffffff;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        .form-header {
            background: #2d3b24;
            padding: 14px 20px;
            color: #a1a1aa;
            font-size: 0.9rem;
            border-bottom: 1px solid #1a2412;
        }
        .cube-icon {
            color: #ef4444;
            font-size: 1.4rem;
            margin-right: 8px;
        }
        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23333%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 1rem top 50%;
            background-size: 0.65rem auto;
        }
        input[type="number"]::-webkit-inner-spin-button { 
            -webkit-appearance: none; 
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- Navbar -->
    <nav class="flex justify-between items-center mb-6 px-2 max-w-md mx-auto">
        <div class="flex items-center text-white text-xl font-bold tracking-wide">
            <span class="cube-icon">◈</span> IMRAN PANEL
        </div>
        <button class="border border-gray-500 rounded p-1.5 text-gray-300 hover:text-white transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
    </nav>

    <div class="max-w-md mx-auto space-y-5">
        
        <!-- Balance Card -->
        <div class="glass-panel p-4 flex items-center gap-3 border border-gray-300">
            <svg class="w-6 h-6 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
            <span class="text-gray-700 text-lg font-medium">Total Saldo <span id="saldo" class="font-semibold">...</span></span>
        </div>

        <!-- Form Card -->
        <div class="form-card">
            <div class="form-header flex justify-between items-center">
                <span class="tracking-wide">Create License</span>
                <svg class="w-4 h-4 text-gray-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm2 6a1 1 0 011-1h6a1 1 0 110 2H7a1 1 0 01-1-1zm1 3a1 1 0 100 2h6a1 1 0 100-2H7z" clip-rule="evenodd"></path></svg>
            </div>
            
            <div class="p-6 space-y-5">
                <!-- Game -->
                <div>
                    <label class="block text-sm text-gray-500 mb-1.5">Game</label>
                    <select id="game" class="w-full bg-white border border-gray-200 rounded p-3 text-gray-800 font-medium focus:outline-none focus:border-gray-400">
                        <option value="PUBG MOBILE">PUBG MOBILE</option>
                        <option value="FREE FIRE">FREE FIRE</option>
                        <option value="CALL OF DUTY">CALL OF DUTY</option>
                    </select>
                </div>

                <!-- Max Devices -->
                <div>
                    <label class="block text-sm text-gray-500 mb-1.5">Max Devices</label>
                    <input type="number" id="maxDevices" value="1" min="1" class="w-full bg-white border border-gray-200 rounded p-3 text-gray-800 font-medium focus:outline-none focus:border-gray-400">
                </div>

                <!-- Duration -->
                <div>
                    <label class="block text-sm text-gray-500 mb-1.5">Duration</label>
                    <select id="duration" class="w-full bg-white border border-gray-200 rounded p-3 text-gray-800 font-medium focus:outline-none focus:border-gray-400">
                        <option value="5 Hours" data-price="0.1">5 Hours — $0.1/Device</option>
                        <option value="1 Day" data-price="0.5">1 Day — $0.5/Device</option>
                        <option value="30 Days" data-price="4.0">30 Days — $4/Device</option>
                        <option value="60 Days" data-price="8.0">60 Days — $8/Device</option>
                    </select>
                </div>

                <button onclick="generateKey()" id="genBtn" class="w-full bg-[#1a2412] hover:bg-[#2d3b24] text-white font-semibold py-3.5 rounded transition duration-200 mt-2 shadow-md">
                    Generate Keys
                </button>
            </div>
        </div>

        <!-- Output Area -->
        <div id="resultBox" class="glass-panel p-5 hidden border border-gray-300">
            <p class="text-xs text-gray-500 font-bold uppercase tracking-wider mb-2">Generated License Key</p>
            <p id="keyText" class="text-lg font-mono text-green-700 font-bold break-all bg-green-50 p-3 rounded border border-green-200"></p>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin; 

        async function loadUser() {
            try {
                const res = await fetch(`${API_URL}/api/user`);
                const data = await res.json();
                document.getElementById('saldo').innerText = `$${data.balance.toLocaleString()}`;
            } catch (e) { console.error("Error loading user"); }
        }

        async function generateKey() {
            const btn = document.getElementById('genBtn');
            btn.innerText = "Generating...";
            btn.disabled = true;

            const game = document.getElementById('game').value;
            const maxDevices = document.getElementById('maxDevices').value;
            const durationSelect = document.getElementById('duration');
            const duration = durationSelect.value;
            const pricePerDevice = parseFloat(durationSelect.options[durationSelect.selectedIndex].dataset.price);
            const totalPrice = pricePerDevice * maxDevices;

            try {
                const res = await fetch(`${API_URL}/api/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ game, max_devices: parseInt(maxDevices), duration, price: totalPrice })
                });

                const data = await res.json();
                
                if (data.success) {
                    document.getElementById('resultBox').classList.remove('hidden');
                    document.getElementById('keyText').innerText = data.key;
                    document.getElementById('saldo').innerText = `$${data.new_balance.toLocaleString()}`;
                } else {
                    alert("Error: " + data.error);
                }
            } catch (err) {
                alert("Server connection failed");
            } finally {
                btn.innerText = "Generate Keys";
                btn.disabled = false;
            }
        }

        loadUser();
    </script>
</body>
</html>
